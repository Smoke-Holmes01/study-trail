[project]
name = "study-trail"
version = "0.1.0"
description = "Study Trail student tutoring platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.121",
    "uvicorn>=0.34",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0",
    "PyMySQL[rsa]>=1.1,<1.2",
    "alembic>=1.14",
    "chromadb-client==1.5.9",
    "pwdlib[argon2]>=0.2",
    "python-multipart>=0.0.20",
    "httpx>=0.28",
    "langgraph>=1.0",
    "mcp==2.3.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "pillow>=11.0",
    "cryptography>=46.0",
    "psutil>=7.0,<8",
    "tzdata>=2026.1",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.25", "ruff>=0.9"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
