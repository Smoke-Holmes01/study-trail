name: study-trail
services:
  db:
    image: pgvector/pgvector@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    environment:
      POSTGRES_USER: study_trail
      POSTGRES_DB: study_trail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U study_trail -d study_trail"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  postgres_data:
